<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрација - Jpstrezevo HelpDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .signup-card { width: 100%; max-width: 420px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="signup-card text-center">
        <h4 class="mb-1 text-primary fw-bold">Креирај профил</h4>
        <p class="text-muted mb-4">Jpstrezevo HelpDesk</p>
        
        <form method="POST" action="/signup">
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Корисничко име</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Лозинка</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Улога</label>
                <select name="role" class="form-select">
                    <option value="manager">Раководител (Manager)</option>
                    <option value="director">Директор (Director)</option>
                </select>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Сектор / Одделение</label>
                <input type="text" name="sector" class="form-control" required placeholder="пр. Технички сектор, Финансии...">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Регистрирај се</button>
        </form>
        
        <div class="mt-3">
            <small class="text-muted">Веќе имате профил? <a href="/login">Најавете се</a></small>
        </div>
    </div>
</body>
</html>
