<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <title>ЈП Стрежево Битола - HelpDesk</title>
    <!-- Bootstrap CSS за уреден изглед -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        
        <!-- Горна лента со информации за корисникот и копчиња за извоз -->
        <div class="row align-items-center mb-4">
            <div class="col-md-6">
                <h2>Добредојде, {{ user.username }} (Улога: {{ user.role }})</h2>
                <p class="text-muted">Сектор: {{ user.sector or 'Сите сектори' }}</p>
            </div>
            
            <div class="col-md-6 text-md-end">
                <!-- Овде се целосните копчиња за извоз во Excel, Word и PDF -->
                <div class="btn-group" role="group" aria-label="Извоз на податоци">
                    <a href="{{ url_for('export_excel') }}" class="btn btn-success btn-sm">Преземи во Excel (.xlsx)</a>
                    <a href="{{ url_for('export_word') }}" class="btn btn-primary btn-sm">Преземи во Word (.docx)</a>
                    <a href="{{ url_for('export_pdf') }}" class="btn btn-danger btn-sm">Преземи во PDF (.pdf)</a>
                </div>
                
                <!-- Копче за одјава -->
                <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm ms-2">Одјави се</a>
            </div>
        </div>

        <hr>

        <!-- Тука продолжува останатиот дел од твојот шаблон за прикажување и доделување на задачите -->
        
    </div>
</body>
</html>
