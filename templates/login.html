<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Најава - ЈП Стрежево HelpDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h4 class="mb-1 text-primary fw-bold">ЈП Стрежево</h4>
        <p class="text-muted mb-4">Систем за работни задачи (HelpDesk)</p>
        
        <form method="POST" action="/login">
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Корисничко име</label>
                <input type="text" name="username" class="form-control" required placeholder="Внесете корисничко име">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Лозинка</label>
                <input type="password" name="password" class="form-control" required placeholder="Внесете лозинка">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Најави се</button>
        </form>
    </div>
</body>
</html>
